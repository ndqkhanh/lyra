[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-skill-curator"
version = "0.1.0"
description = "RL-trained Skill Curator, mining, evaluation, promotion, instinct extraction, confidence scoring, and marketplace sync."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
python_functions = "test_*"
python_classes = "Test*"
testpaths = ["tests"]
