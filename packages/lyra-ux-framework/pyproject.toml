[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-ux-framework"
version = "0.1.0"
description = "Agent UX framework — interaction patterns, feedback mechanisms, progressive disclosure"
requires-python = ">=3.11"
dependencies = ["lyra-core"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]