[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-identity"
version = "0.1.0"
description = "Agent fingerprinting — content-addressable hashing, cryptographic provenance, signed manifests"
requires-python = ">=3.11"
dependencies = ["lyra-core"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
