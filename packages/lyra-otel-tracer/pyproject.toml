[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-otel-tracer"
version = "0.1.0"
description = "OpenTelemetry-inspired tracing, token tracking, latency monitoring, cost attribution, hallucination detection, drift monitoring, and Prometheus export for Lyra multi-agent systems"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]
