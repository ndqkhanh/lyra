[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-legacy"
version = "0.1.0"
description = "Legacy and reputation tracking — long-term identity, impact, and memory preservation"
requires-python = ">=3.11"
dependencies = ["lyra-core"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
