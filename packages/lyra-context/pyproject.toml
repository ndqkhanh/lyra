[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lyra-context"
version = "0.1.0"
description = "Auto-compaction engine — AOI-style compression, norm-guided KV-cache eviction, progressive disclosure"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-memory"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
