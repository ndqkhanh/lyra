[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-verification"
version = "0.1.0"
description = "Phase 5: 4-layer verification architecture — inline guards, online sampling, offline deep, continuous monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lyra Contributors" }]
dependencies = [
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
python_functions = "test_*"
python_classes = "Test*"
testpaths = ["tests"]
markers = [
    "phase5: Phase 5 verification tests.",
]
