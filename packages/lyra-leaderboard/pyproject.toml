[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-leaderboard"
version = "0.1.0"
description = "Public AGI score leaderboard — version tracking, standardized scoring, comparison"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-evals-evolved"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
