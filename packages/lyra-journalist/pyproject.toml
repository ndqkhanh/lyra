[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-journalist"
version = "0.1.0"
description = "Journalism agent — investigative research, fact-checking, article generation"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-honesty"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
