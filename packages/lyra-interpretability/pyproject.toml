[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-interpretability"
version = "0.1.0"
description = "Agent interpretability — decision tracing, feature attribution, saliency maps, counterfactual explanations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_interpretability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=lyra_interpretability --cov-report=term-missing"
