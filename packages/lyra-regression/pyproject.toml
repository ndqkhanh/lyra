[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-regression"
version = "0.1.0"
description = "Regression detection — detect catastrophic forgetting, rollback, task archive"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-continual"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
