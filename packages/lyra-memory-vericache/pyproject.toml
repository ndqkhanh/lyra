[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-memory-vericache"
version = "0.1.0"
description = "Lossless KV cache compression — full-KV equivalence with compressed throughput"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-memory"]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]