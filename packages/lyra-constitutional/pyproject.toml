[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-constitutional"
version = "0.1.0"
description = "constitutional — Plan 16: Lyra AGI architecture"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-ethics"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
