[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-science-pipeline"
version = "0.1.0"
description = "Scientific discovery pipeline: Hypothesize→Experiment→Analyze→Learn"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-causal-graph", "lyra-research"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]