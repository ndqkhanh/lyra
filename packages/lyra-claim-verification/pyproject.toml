[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-claim-verification"
version = "0.1.0"
description = "Pramana-format claim attestation with 4 claim types and verification DAG"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-attestor"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]