[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-vision"
version = "0.1.0"
description = "Multi-modal vision module for Lyra — screenshot understanding, OCR, diagram parsing, visual QA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=lyra_vision --cov-report=term-missing"
