[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-evals-evolved"
version = "0.1.0"
description = "AGI benchmark suite runner — SpecBench, AgentBench, TerminalWorld, BioStream, CLEAR, open-ended eval"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-evals"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
