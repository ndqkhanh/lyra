[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-memory-stack"
version = "0.1.0"
description = "Multi-layered memory system for Lyra agents — active context, episodic, semantic, and procedural memory with progressive retrieval"
requires-python = ">=3.11"
dependencies = ["lyra-core"]
[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]
[tool.setuptools.packages.find]
where = ["src"]
