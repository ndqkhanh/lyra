[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-adversarial"
version = "0.1.0"
description = "Adversarial robustness — red teaming, jailbreak resistance, edge case testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_adversarial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=lyra_adversarial --cov-report=term-missing"
