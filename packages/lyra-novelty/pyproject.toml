[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-novelty"
version = "0.1.0"
description = "Curiosity/novelty seeking — intrinsic motivation, exploration drive, information gain"
requires-python = ">=3.11"
dependencies = ["lyra-core"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
