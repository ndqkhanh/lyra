[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-skill-generator"
version = "0.1.0"
description = "SkillNet-based auto-generator for Lyra skills — template-driven skill generation with 5-D quality scoring and deterministic fallback."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v -ra"
testpaths = ["tests"]
