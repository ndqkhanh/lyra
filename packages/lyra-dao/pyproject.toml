[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-dao"
version = "0.1.0"
description = "DAO governance for agents — decentralized voting, proposals, collective decision-making"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-economy"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]