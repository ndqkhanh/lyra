[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-emotion"
version = "0.1.0"
description = "Emotional intelligence — emotion recognition, expression calibration, adaptive empathy"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-personality"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
