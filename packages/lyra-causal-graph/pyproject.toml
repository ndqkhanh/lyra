[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-causal-graph"
version = "0.2.0"
description = "Causal discovery, intervention, counterfactual reasoning, and root cause analysis for AGI agent traces"
requires-python = ">=3.11"
dependencies = [
    "lyra-core",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "pydantic>=2.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
