[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lyra-plugins"
version = "0.1.0"
description = "Plugin system — marketplace-style plugin discovery, manifest validation, sandboxed loading"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-provider"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
