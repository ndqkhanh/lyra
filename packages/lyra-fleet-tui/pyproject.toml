[project]
name = "lyra-fleet-tui"
version = "0.1.0"
description = "Terminal UI for Lyra agent fleet supervision"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.52",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
