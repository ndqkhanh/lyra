[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-context-profiler"
version = "0.1.0"
description = "Real-time environment analysis for optimal skill selection"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-skills"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]