[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-studio"
version = "0.1.0"
description = "Visual agent builder — GUI for designing, connecting, and deploying agent pipelines"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-skills"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
