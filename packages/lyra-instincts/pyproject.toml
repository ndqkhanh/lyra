[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-instincts"
version = "0.1.0"
description = "Pre-wired behavioral pattern layer — instincts collection, evolution, pruning, and promotion"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-skills"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
