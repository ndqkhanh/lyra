[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-experiment"
version = "0.1.0"
description = "Agent A/B testing and experimentation platform — greenfield category"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-evals"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
