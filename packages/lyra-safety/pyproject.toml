[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "lyra-safety"
version = "0.1.0"
description = "4-layer defense-in-depth safety guardrails — LlamaFirewall + CaMeL + NeMo + Progent patterns"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-provider"]
[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
[tool.setuptools.packages.find]
where = ["src"]
