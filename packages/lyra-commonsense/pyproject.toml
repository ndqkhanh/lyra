[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-commonsense"
version = "0.1.0"
description = "Common sense knowledge base — everyday world knowledge, physical reasoning"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-beliefs"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
