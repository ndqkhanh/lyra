[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-permissions"
version = "0.1.0"
description = "Permission management and bypass mode for Lyra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
]

[project.scripts]
lyra-permissions = "lyra_permissions.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_permissions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=lyra_permissions --cov-report=term-missing"
