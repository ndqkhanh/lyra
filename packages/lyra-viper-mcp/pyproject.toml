[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-viper-mcp"
version = "0.1.0"
description = "MCP taint-style vulnerability detection and exploitation framework"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["lyra-core", "lyra-mcp"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
