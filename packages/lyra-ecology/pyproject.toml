[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-ecology"
version = "0.1.0"
description = "Agent ecology simulator — emergent AGI through competition, resource scarcity, and evolutionary selection"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-evolution"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
