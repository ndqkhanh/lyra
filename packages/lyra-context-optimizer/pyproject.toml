[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-context-optimizer"
version = "0.1.0"
description = "Context window optimization — agent-driven compaction, verbatim pruning, async compression, knowledge blocks, input/output compression, DACS switching, and metrics tracking"
requires-python = ">=3.11"
dependencies = ["lyra-core"]
[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
[tool.setuptools.packages.find]
where = ["src"]
