[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-self-rewrite"
version = "0.1.0"
description = "Differentiable Goal Model (DGM) HyperAgent engine for recursive self-improvement through goal-driven mutation, multi-objective fitness, and constraint-guided code rewrite generation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]
