[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-cybersecurity"
version = "0.1.0"
description = "Cybersecurity agent — threat hunting, vulnerability assessment, incident response"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-verification-mesh"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
