[project]
name = "lyra-sandbox"
version = "0.1.0"
description = "Phase 4.3: Swarm & Safety — Sandboxed code execution across process, Docker, and secure environments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lyra Team", email = "team@lyra.ai"}
]
dependencies = [
    "lyra-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=lyra_sandbox --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
