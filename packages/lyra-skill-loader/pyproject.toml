[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-skill-loader"
version = "0.1.0"
description = "Package 3.2 of Phase 3: Skills Ecosystem — progressive-disclosure skill loading with trigger matching, context budgeting, compilation, and dependency resolution."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "-v -ra"
testpaths = ["tests"]
