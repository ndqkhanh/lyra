[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-meta-evolution"
version = "0.1.0"
description = "Four-level meta-cognitive evolution stack for recursive self-improvement"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-evolution", "lyra-fork-worker"]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]