[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-hbhc"
version = "0.1.0"
description = "Heartbeat-Bound Hierarchical Credentials — cryptographic revocation for agent swarms"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["lyra-core", "cryptography>=41.0"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
