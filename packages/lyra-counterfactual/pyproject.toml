[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-counterfactual"
version = "0.1.0"
description = "Counterfactual simulation engine — what-if reasoning over causal graphs"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-causal-graph"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]