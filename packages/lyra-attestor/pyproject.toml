[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-attestor"
version = "0.1.0"
description = "Pramana-format claim attestation with verification DAG"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["lyra-core"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
