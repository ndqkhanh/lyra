[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-recursive-reward"
version = "0.1.0"
description = "Three nested reward loops preventing reward hacking at every level"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-evolution", "lyra-evals"]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]