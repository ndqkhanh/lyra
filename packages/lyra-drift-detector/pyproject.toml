[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-drift-detector"
version = "0.1.0"
description = "Multi-signal drift detection: performance, context, distribution, reward"
requires-python = ">=3.11"
dependencies = ["lyra-core", "numpy>=1.24", "lyra-evals"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]