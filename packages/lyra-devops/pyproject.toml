[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-devops"
version = "0.1.0"
description = "DevOps/SRE agent suite — infrastructure monitoring, incident response, self-healing"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-sla", "lyra-resilience"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
