[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-autoresearch"
version = "1.0.0"
description = "AutoResearchClaw integration for Lyra - Citation verification, self-healing execution, structured debates, and evolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "lyra-core",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests with no I/O or network",
    "integration: tests that require external services",
]
