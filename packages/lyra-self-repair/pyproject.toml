[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-self-repair"
version = "0.1.0"
description = "Self-repair — detect anomalies, diagnose root cause, apply fix, verify restoration"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-resilience"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
