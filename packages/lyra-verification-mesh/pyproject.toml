[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-verification-mesh"
version = "0.1.0"
description = "Three-layer verification mesh: Causal Past Logic + Pseudo-Formalization + Runtime Monitoring"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["lyra-core", "lyra-attestor"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
