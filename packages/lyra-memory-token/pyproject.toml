[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-memory-token"
version = "0.1.0"
description = "Token-native memory index — retrieval via token overlap, no embeddings, no vector DB"
requires-python = ">=3.11"
dependencies = ["lyra-core", "lyra-memory"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[tool.setuptools.packages.find]
where = ["src"]
