[project]
name = "lyra-tools"
version = "1.0.0"
description = "Lyra Tools Universe — Centralized tool registry with 200+ tools across 20 toolsets"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
